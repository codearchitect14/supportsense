[project]
name = "supportsense-backend"
version = "0.1.0"
description = "AI customer support chatbot, voice agent, and revenue analytics backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "sentence-transformers>=3.0",
    "groq>=0.11",
    "google-genai>=1.0",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",  # passlib 1.7.4's bcrypt self-test breaks on bcrypt>=4.1, see https://github.com/pyca/bcrypt/issues/684
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "slowapi>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.8",
    "pip-audit>=2.7",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "load: synthetic load tests, slower and skipped by default (run with -m load)",
]
addopts = "-m 'not load'"
timeout = 60
